<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Candidates – Election Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .hero-gradient {
            background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.06), transparent),
                        radial-gradient(circle at bottom left, rgba(30, 41, 59, 0.02), transparent);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .search-focus-ring {
            @apply focus:ring-[12px] focus:ring-blue-600/5 focus:border-blue-600 outline-none transition-all duration-300;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }

        /* Compact Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen hero-gradient selection:bg-blue-100">

    <!-- NAVIGATION -->
    <nav class="w-full px-8 py-4 sticky top-0 z-50 bg-white/60 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-[1600px] mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="h-12 flex items-center justify-center rounded-xl bg-white/40 shadow-sm border border-slate-100/50 px-2.5">
                    <img src="cclogo.png" alt="Portal Logo" class="h-10 w-auto object-contain">
                </div>
                <div class="hidden sm:block leading-tight">
                    <span class="text-sm font-black tracking-tight text-slate-900 block">Election Portal</span>
                    <span class="text-[7px] font-black text-blue-600 uppercase tracking-widest mt-0.5 block">Facilitated by Intersect</span>
                </div>
            </div>
            
            <div class="hidden md:flex items-center gap-6">
                <a href="index.html" class="text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-blue-600 transition-colors">Home</a>
                <a href="register.html" class="text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-blue-600 transition-colors">Register</a>
                <a href="candidates.html" class="text-blue-600 border-b-2 border-blue-600 pb-1 text-[9px] font-black uppercase tracking-widest">Candidates</a>
                <a href="resources.html" class="text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-blue-600 transition-colors">Resources</a>
            </div>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto px-8 pt-10 pb-32">
        
        <!-- HEADER ROW: Title & Search Unit -->
        <div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div>
                <div class="inline-flex items-center gap-2.5 px-2.5 py-1 bg-blue-50 border border-blue-100 rounded-full mb-3">
                    <span class="h-1 w-1 bg-blue-600 rounded-full animate-pulse"></span>
                    <span class="text-[8px] font-black text-blue-600 uppercase tracking-widest">Public Registry</span>
                </div>
                <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tighter leading-none">
                    Meet the <span class="text-blue-600">Candidates.</span>
                </h1>
            </div>

            <!-- SEARCH UNIT -->
            <div class="relative w-full md:w-80 group">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-blue-600 transition-colors text-xs"></i>
                <input type="text" id="searchInput" onkeyup="applySearch()" placeholder="Filter by name..." 
                    class="w-full bg-white border border-slate-100 rounded-xl pl-10 pr-4 py-3 text-xs font-bold search-focus-ring placeholder:text-slate-300 shadow-sm">
            </div>
        </div>

        <!-- FILTER ROW: Categories below header -->
        <div class="mb-12 flex flex-wrap items-center gap-2" id="filter-container">
            <!-- Automatically built by Portal Logic -->
            <div class="h-10 w-32 bg-slate-100 rounded-xl animate-pulse"></div>
        </div>

        <!-- HIGH-DENSITY GRID (3 COLUMNS) -->
        <div id="candidates-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 min-h-[400px]">
            <!-- Initially populated by Directory Engine -->
            <div class="col-span-full py-40 text-center animate-fadeIn">
                <div class="inline-block h-8 w-8 border-[3px] border-slate-100 border-t-blue-600 rounded-full animate-spin"></div>
                <p class="text-slate-400 font-black uppercase tracking-[0.4em] text-[8px] mt-6">Loading candidates...</p>
            </div>
        </div>

        <!-- EMPTY STATE -->
        <div id="empty-state" class="hidden text-center py-24 glass-card rounded-[2.5rem] mt-10 border-dashed border-2 border-slate-100">
            <div class="h-14 w-14 bg-slate-50 rounded-2xl flex items-center justify-center mx-auto mb-5 text-slate-200 text-xl">
                <i class="fas fa-user-slash"></i>
            </div>
            <h3 class="text-lg font-black text-slate-900 mb-1 tracking-tight">No identities found</h3>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Adjust your search or category filters</p>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="w-full px-8 py-12 border-t border-slate-100 bg-white/30 mt-12">
        <div class="max-w-[1600px] mx-auto flex flex-col md:flex-row justify-between items-center gap-10">
            <div class="flex items-center gap-4">
                <div class="h-12 px-3 flex items-center justify-center rounded-xl bg-white/40 shadow-sm border border-slate-100/50">
                    <img src="cclogo.png" alt="Portal Logo" class="h-8 w-auto object-contain opacity-70">
                </div>
                <div class="text-left leading-tight">
                    <span class="text-sm font-black tracking-tight text-slate-900 block leading-none">Election Portal</span>
                    <span class="text-[7px] font-black text-blue-600 uppercase tracking-widest mt-1 block">
                        Facilitated by <a href="https://www.intersectmbo.org/" target="_blank" class="hover:underline">Intersect</a>
                    </span>
                </div>
            </div>
            <div class="flex gap-6">
                <a href="https://x.com/intersectmbo" target="_blank" class="text-slate-300 hover:text-slate-900 transition-all hover:scale-110"><i class="fab fa-x-twitter text-lg"></i></a>
                <a href="https://github.com/IntersectMBO/" target="_blank" class="text-slate-300 hover:text-slate-900 transition-all hover:scale-110"><i class="fab fa-github text-lg"></i></a>
            </div>
        </div>
    </footer>

    <!-- Core Scripts -->
    <script src="public/js/portal/portal-state.js"></script>
    <script src="public/js/portal/portal-vault.js"></script>
    <script src="public/js/portal/portal-form-engine.js"></script>
    <script src="public/js/portal/portal-directory.js"></script>
    <script src="public/js/portal/portal-main.js"></script>
</body>
</html>
