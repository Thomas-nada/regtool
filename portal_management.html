<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Console – Election Portal</title>
    <!-- Core: Tailwind & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* --- PREMIUM UI GRADIENTS & DEPTH --- */
        .hero-gradient {
            background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.05), transparent),
                        radial-gradient(circle at bottom left, rgba(30, 41, 59, 0.02), transparent);
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid #f1f5f9;
        }

        /* --- Navigation Buttons --- */
        .nav-btn {
            @apply px-10 py-4 rounded-full text-[10px] font-black uppercase tracking-[0.3em] transition-all duration-300 border-2 whitespace-nowrap shadow-sm flex items-center justify-center;
        }

        /* CHROMATIC IDENTITY SCHEMES */
        .btn-audit { background-color: #dbeafe !important; border-color: #2563eb !important; color: #1d4ed8 !important; }
        .btn-form  { background-color: #d1fae5 !important; border-color: #059669 !important; color: #047857 !important; }
        .btn-roadmap { background-color: #fef3c7 !important; border-color: #d97706 !important; color: #b45309 !important; }
        .btn-teams { background-color: #ffe4e6 !important; border-color: #e11d48 !important; color: #be123c !important; }
        .btn-system { background-color: #e0e7ff !important; border-color: #4f46e5 !important; color: #4338ca !important; }

        /* ACTIVE STATE RECOGNITION */
        .active-audit { background-color: #2563eb !important; color: #ffffff !important; box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.2) !important; transform: scale(1.05); border-color: transparent !important; }
        .active-form  { background-color: #059669 !important; color: #ffffff !important; box-shadow: 0 20px 25px -5px rgba(5, 150, 105, 0.2) !important; transform: scale(1.05); border-color: transparent !important; }
        .active-roadmap { background-color: #d97706 !important; color: #ffffff !important; box-shadow: 0 20px 25px -5px rgba(217, 119, 6, 0.2) !important; transform: scale(1.05); border-color: transparent !important; }
        .active-teams { background-color: #e11d48 !important; color: #ffffff !important; box-shadow: 0 20px 25px -5px rgba(225, 29, 72, 0.2) !important; transform: scale(1.05); border-color: transparent !important; }
        .active-system { background-color: #4f46e5 !important; color: #ffffff !important; box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.2) !important; transform: scale(1.05); border-color: transparent !important; }

        .nav-btn:hover:not([class*="active-"]) { 
            transform: translateY(-4px); 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); 
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen hero-gradient selection:bg-blue-100">

    <!-- Login Modal -->
    <div id="login-overlay" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/95 backdrop-blur-xl p-6">
        <div class="max-w-md w-full bg-white rounded-[4rem] p-14 text-center shadow-3xl border border-white/20">
            <div class="h-20 w-20 bg-slate-900 rounded-[2rem] flex items-center justify-center mx-auto mb-10 shadow-2xl animate-pulse">
                <i class="fas fa-fingerprint text-white text-3xl"></i>
            </div>
            <h2 class="text-3xl font-black text-slate-900 tracking-tighter mb-4 uppercase">Identity Required</h2>
            <p class="text-slate-400 text-sm font-medium mb-10">Enter your admin token to access the management console.</p>
            <div class="space-y-4">
                <input type="password" id="admin-password" placeholder="Master Token..." 
                    class="w-full bg-slate-50 border-2 border-slate-200 rounded-full px-8 py-6 text-sm font-bold focus:border-blue-600 outline-none transition-all text-center placeholder:text-slate-200">
                <button id="login-btn" onclick="PortalAdminUI.performLogin()" class="w-full py-6 bg-slate-900 text-white font-black uppercase tracking-widest text-[10px] rounded-full shadow-xl hover:bg-black transition-all active:scale-95">
                    Establish Secure Session
                </button>
            </div>
            <div class="mt-8 pt-8 border-t border-slate-50 flex justify-center gap-4 opacity-20">
                <i class="fas fa-shield-halved"></i>
                <i class="fas fa-microchip"></i>
                <i class="fas fa-vault"></i>
            </div>
        </div>
    </div>

    <!-- AUDIT DETAIL MODAL: CONTEXTUAL ATTRIBUTION -->
    <div id="audit-detail-modal" class="fixed inset-0 z-[300] hidden items-center justify-center bg-slate-950/40 backdrop-blur-md p-6">
        <div class="glass-card max-w-lg w-full rounded-[2.5rem] p-8 md:p-10 shadow-3xl border border-white animate-fadeIn">
            <div class="flex items-center gap-4 mb-6">
                <div class="h-12 w-12 bg-blue-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-blue-600/20">
                    <i class="fas fa-file-signature"></i>
                </div>
                <div>
                    <h3 class="text-2xl font-black text-slate-900 tracking-tight leading-none">Audit Context</h3>
                    <p class="text-slate-400 text-[9px] font-black uppercase tracking-widest mt-2">Add details (optional)</p>
                </div>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 ml-2">What changes were made?</label>
                    <textarea id="audit-change-input" rows="2" class="w-full bg-slate-50 border border-slate-100 rounded-2xl p-4 text-sm font-medium text-slate-700 focus:ring-8 focus:ring-blue-600/5 focus:border-blue-600 outline-none transition-all resize-none" placeholder="Describe the modification..."></textarea>
                </div>
                <div>
                    <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 ml-2">Why was this change made?</label>
                    <textarea id="audit-reason-input" rows="2" class="w-full bg-slate-50 border border-slate-100 rounded-2xl p-4 text-sm font-medium text-slate-700 focus:ring-8 focus:ring-blue-600/5 focus:border-blue-600 outline-none transition-all resize-none" placeholder="Provide justification or reference..."></textarea>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-10">
                <button onclick="PortalAdminUI.closeAuditModal(true)" class="w-full py-4 bg-slate-100 text-slate-400 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-slate-200 hover:text-slate-900 transition-all">
                    Skip Details
                </button>
                <button onclick="PortalAdminUI.closeAuditModal(false)" class="w-full py-4 bg-blue-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-blue-700 shadow-xl shadow-blue-900/20 transition-all">
                    Commit Action
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD ARCHITECTURE -->
    <div id="admin-dashboard" class="hidden min-h-screen flex flex-col">
        
        <!-- HEADER MODULE: NAVIGATION & TELEMETRY -->
        <header class="sticky top-0 z-[100] glass-header px-10 py-10 shadow-2xl shadow-blue-900/[0.04]">
            <div class="max-w-[1800px] mx-auto flex items-center justify-between gap-12">
                
                <!-- BRANDING & CLOCK -->
                <div class="flex items-center gap-6 flex-shrink-0">
                    <div class="h-16 w-16 bg-slate-900 rounded-[1.6rem] flex items-center justify-center text-white shadow-xl relative">
                        <i class="fas fa-shield-halved text-2xl"></i>
                        <div class="absolute -top-1 -right-1 h-4 w-4 bg-blue-600 rounded-full border-4 border-white animate-pulse"></div>
                    </div>
                    <div class="hidden xl:block leading-none">
                        <h2 class="text-xl font-black tracking-tighter text-slate-900 uppercase leading-none">Console</h2>
                        <div class="inline-flex items-center gap-2 mt-2 px-3 py-1 bg-slate-100 rounded-full border border-slate-200">
                            <span id="utc-clock-admin" class="text-[8px] font-black text-slate-500 uppercase tracking-widest leading-none">SYNCING...</span>
                        </div>
                    </div>
                </div>

                <!-- Primary Navigation -->
                <nav class="flex-grow flex items-center justify-center gap-4">
                    <button onclick="PortalAdminUI.setView('applicants')" id="nav-applicants" class="nav-btn btn-audit active-audit">Registry</button>
                    <button onclick="PortalAdminUI.setView('audit-log')" id="nav-audit-log" class="nav-btn btn-system">Audit Track</button>
                    <button onclick="PortalAdminUI.setView('architect')" id="nav-architect" class="nav-btn btn-form">Form</button>
                    <button onclick="PortalAdminUI.setView('timeline')" id="nav-timeline" class="nav-btn btn-roadmap">Roadmap</button>
                    <button onclick="PortalAdminUI.setView('teams')" id="nav-teams" class="nav-btn btn-teams">Teams</button>
                    <button onclick="PortalAdminUI.setView('settings')" id="nav-settings" class="nav-btn btn-system">Scheduler</button>
                </nav>

                <!-- SESSION CONTROLS -->
                <div class="flex items-center gap-4 flex-shrink-0">
                    <a href="index.html" target="_blank" class="px-10 py-4 bg-white border-2 border-slate-100 rounded-full text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-slate-900 hover:border-blue-600 hover:shadow-xl transition-all">
                        Public View
                    </a>
                    <button onclick="location.reload()" class="h-14 w-14 rounded-full bg-red-50 text-red-500 border-2 border-red-100 hover:bg-red-500 hover:text-white transition-all shadow-sm flex items-center justify-center group">
                        <i class="fas fa-power-off text-lg group-hover:rotate-90 transition-transform"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- MAIN OPERATIONAL CORE -->
        <main class="max-w-[1600px] w-full mx-auto p-12 overflow-y-auto flex-grow">
            
            <!-- Global Search -->
            <div class="max-w-7xl mx-auto mb-16 flex justify-between items-center">
                <div class="relative w-full max-w-xl group">
                    <i class="fas fa-search absolute left-8 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-blue-600 transition-colors"></i>
                    <input type="text" id="admin-search" placeholder="Search candidates..."
                        class="w-full bg-white border-2 border-slate-100 rounded-full pl-16 pr-8 py-6 text-sm font-bold focus:ring-[20px] focus:ring-blue-600/5 focus:border-blue-500 outline-none transition-all shadow-sm">
                </div>
                
                <div class="flex items-center gap-8">
                    <div class="text-right">
                        <p class="text-[9px] font-black text-slate-300 uppercase tracking-widest mb-1">Authorization</p>
                        <p class="text-sm font-black text-slate-900 uppercase">Election Authority</p>
                    </div>
                    <div class="h-16 w-16 rounded-[1.8rem] bg-white border-2 border-slate-100 shadow-xl flex items-center justify-center text-slate-400">
                        <i class="fas fa-user-shield text-xl"></i>
                    </div>
                </div>
            </div>

            <!-- DYNAMIC MODULE TARGET -->
            <div id="admin-content-target" class="animate-fadeIn min-h-[600px]">
                <div class="py-40 text-center animate-pulse">
                    <div class="h-12 w-12 border-4 border-slate-100 border-t-blue-600 rounded-full mx-auto mb-8 animate-spin"></div>
                    <p class="text-slate-400 text-[10px] font-black uppercase tracking-[0.4em]">Loading modules...</p>
                </div>
            </div>

        </main>
    </div>

    <!-- Toast Notification -->
    <div id="admin-toast" class="fixed bottom-12 right-12 z-[200] opacity-0 translate-y-8 transition-all duration-700 pointer-events-none">
        <div class="bg-slate-900 text-white px-10 py-6 rounded-full shadow-3xl flex items-center gap-6 border border-white/10">
            <div class="h-10 w-10 bg-blue-600 rounded-full flex items-center justify-center shadow-lg">
                <i class="fas fa-check text-sm"></i>
            </div>
            <span id="admin-toast-msg" class="text-[10px] font-black uppercase tracking-widest">Changes saved</span>
        </div>
    </div>

    <!-- CORE SCRIPTS: IDENTITY MANAGEMENT SUITE -->
    <script src="public/js/admin/portal-admin-state.js"></script>
    <script src="public/js/admin/portal-admin-api.js"></script>
    
    <!-- UI Modules (load order matters) -->
    <script src="public/js/admin/portal-ui-utils.js"></script>
    <script src="public/js/admin/portal-ui-applicants.js"></script>
    <script src="public/js/admin/portal-ui-audit.js"></script>
    <script src="public/js/admin/portal-ui-architect.js"></script>
    <script src="public/js/admin/portal-ui-roadmap.js"></script>
    <script src="public/js/admin/portal-ui-teams.js"></script>
    <script src="public/js/admin/portal-ui-scheduler.js"></script>
    
    <!-- Main Controller (load last) -->
    <script src="public/js/admin/portal-admin-ui.js"></script>
</body>
</html>
