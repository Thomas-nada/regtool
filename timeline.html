<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Portal – Progress Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .hero-gradient {
            background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.08), transparent),
                        radial-gradient(circle at bottom left, rgba(30, 41, 59, 0.02), transparent);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .phase-container {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --- HIGH-POP PILL SYSTEM --- */
        .modern-pill {
            @apply px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider border transition-all duration-300 flex items-center gap-2 shadow-sm;
        }

        /* Status Colors */
        .status-completed { 
            @apply bg-emerald-600 text-white border-emerald-500 shadow-emerald-500/30 hover:bg-emerald-500 hover:-translate-y-0.5; 
        }
        .status-progress { 
            @apply bg-blue-600 text-white border-blue-500 shadow-blue-500/30 hover:bg-blue-500 hover:-translate-y-0.5; 
        }

        /* Team Distinction Badges */
        .team-gov { @apply bg-indigo-100 text-indigo-700 border-indigo-200; }
        .team-dq { @apply bg-fuchsia-100 text-fuchsia-700 border-fuchsia-200; }
        .team-ekklesia { @apply bg-orange-100 text-orange-700 border-orange-200; }
        .team-civics { @apply bg-rose-100 text-rose-700 border-rose-200; }
        .team-intersect { @apply bg-teal-100 text-teal-700 border-teal-200; }
        .team-default { @apply bg-slate-100 text-slate-600 border-slate-200; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.6s ease-out forwards; }

        /* Progress Circle Glow */
        .progress-glow { filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.4)); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen hero-gradient selection:bg-blue-100 selection:text-blue-900">

    <!-- NAVIGATION -->
    <nav class="w-full px-8 py-5 sticky top-0 z-50 bg-white/50 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="h-18 flex items-center justify-center rounded-xl bg-white/40 shadow-sm border border-slate-100/50 px-3">
                    <img src="cclogo.png" alt="Portal Logo" class="h-14 w-auto object-contain">
                </div>
                <div class="hidden sm:block">
                    <span class="text-lg font-black tracking-tight text-slate-900 block leading-none">Election Portal</span>
                    <span class="text-[8px] font-black text-blue-600 uppercase tracking-widest mt-1 block">Facilitated by Intersect</span>
                </div>
            </div>
            
            <div class="hidden md:flex items-center gap-8">
                <a href="index.html" class="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-blue-600 transition-colors">Home</a>
                <a href="register.html" class="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-blue-600 transition-colors">Register</a>
                <a href="candidates.html" class="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-blue-600 transition-colors">Candidates</a>
                <a href="resources.html" class="text-blue-600 border-b-2 border-blue-600 pb-1.5 text-[10px] font-black uppercase tracking-widest">Resources</a>
            </div>
        </div>
    </nav>

    <!-- HERO HEADER -->
    <main class="max-w-6xl mx-auto px-8 pt-12 pb-32">
        <header class="mb-12 flex flex-col lg:flex-row justify-between items-start lg:items-end gap-8 text-center lg:text-left">
            <div>
                <div class="inline-flex items-center gap-3 px-3 py-1.5 bg-blue-50 border border-blue-100 rounded-full mb-6">
                    <span class="h-1.5 w-1.5 bg-blue-600 rounded-full animate-pulse"></span>
                    <span class="text-[9px] font-black text-blue-600 uppercase tracking-widest">Live Roadmap</span>
                </div>
                <h1 class="text-4xl md:text-6xl font-black text-slate-900 tracking-tighter leading-none mb-4">
                    Election <br> <span class="text-blue-600">Timeline.</span>
                </h1>
                <p class="text-base text-slate-500 font-medium max-w-xl leading-relaxed">
                    Real-time monitoring of phases and task completion.
                </p>
            </div>

            <!-- GLOBAL PROGRESS RADIUS -->
            <div class="glass-card rounded-[2.5rem] p-8 border border-slate-100/50 flex flex-col items-center min-w-[220px] mx-auto lg:mx-0 shadow-2xl shadow-blue-900/[0.03]">
                <span class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Current Status</span>
                <div class="relative flex items-center justify-center">
                    <svg class="w-24 h-24 transform -rotate-90">
                        <circle cx="48" cy="48" r="40" stroke="currentColor" stroke-width="8" fill="transparent" class="text-slate-100" />
                        <circle id="circle-progress" cx="48" cy="48" r="40" stroke="currentColor" stroke-width="8" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2" class="text-blue-600 transition-all duration-1000 ease-out progress-glow" />
                    </svg>
                    <span id="percent-text" class="absolute text-2xl font-black text-slate-900 tracking-tighter">0%</span>
                </div>
            </div>
        </header>

        <!-- TIMELINE FEED -->
        <div id="frontend-container" class="space-y-12">
            <div id="loader" class="flex flex-col items-center py-24 text-slate-400">
                <div class="animate-spin rounded-full h-10 w-10 border-4 border-slate-200 border-t-blue-600 mb-6"></div>
                <p class="font-black text-[10px] uppercase tracking-[0.3em]">Loading timeline...</p>
            </div>
        </div>

        <!-- Error State -->
        <div id="error-box" class="hidden max-w-md mx-auto mt-20 glass-card p-12 rounded-[3rem] text-center animate-fadeIn border-rose-100">
            <div class="text-rose-500 mb-6 flex justify-center"><i class="fas fa-exclamation-triangle text-4xl"></i></div>
            <h3 class="font-black text-slate-900 text-xl mb-3 tracking-tight">Sync Fault</h3>
            <p class="text-slate-400 text-sm font-medium mb-8">Unable to retrieve the election roadmap.</p>
            <button onclick="location.reload()" class="w-full py-4 bg-slate-900 text-white text-[10px] font-black uppercase tracking-widest rounded-2xl shadow-xl">Retry Sync</button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full px-8 py-20 border-t border-slate-100 bg-white/30 mt-12">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-10">
            <div class="flex items-center gap-4">
                <div class="h-18 px-3 flex items-center justify-center rounded-xl bg-white/40 shadow-sm border border-slate-100/50">
                    <img src="cclogo.png" alt="Portal Logo" class="h-14 w-auto object-contain opacity-80">
                </div>
                <div class="text-left">
                    <span class="text-lg font-black tracking-tight text-slate-900 block leading-none">Election Portal</span>
                    <span class="text-[8px] font-black text-blue-600 uppercase tracking-widest mt-1 block">Facilitated by <a href="https://www.intersectmbo.org/" target="_blank" class="hover:underline">Intersect</a></span>
                </div>
            </div>
            <div class="flex gap-8">
                <a href="https://x.com/intersectmbo" target="_blank" class="text-slate-300 hover:text-slate-900 transition-colors"><i class="fab fa-x-twitter text-xl"></i></a>
                <a href="https://github.com/IntersectMBO/" target="_blank" class="text-slate-300 hover:text-slate-900 transition-colors"><i class="fab fa-github text-xl"></i></a>
            </div>
        </div>
    </footer>

    <!-- Core Scripts -->
    <script src="public/js/portal/portal-state.js"></script>
    <!-- PAGE-SPECIFIC ENGINE -->
    <script src="public/js/portal/portal-timeline.js"></script>
</body>
</html>
